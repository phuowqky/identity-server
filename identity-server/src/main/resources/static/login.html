<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <style>
        :root { color-scheme: light dark; --bg: #f5f6f8; --card: #fff; --text: #1a1a1a; --muted: #666; --border: #d0d4da; --primary: #2563eb; --error: #b91c1c; }
        @media (prefers-color-scheme: dark) { :root { --bg: #111318; --card: #1c1f26; --text: #e8e8e8; --muted: #9a9a9a; --border: #333843; --primary: #3b82f6; --error: #f87171; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
        .card { width: min(380px, 92vw); background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
        h1 { font-size: 20px; margin: 0 0 20px; }
        label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
        button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: .6; cursor: default; }
        .error { color: var(--error); font-size: 13px; min-height: 20px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Đăng nhập</h1>
    <label for="username">Tên đăng nhập</label>
    <input id="username" autocomplete="username" autofocus>
    <label for="password">Mật khẩu</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="submit">Đăng nhập</button>
    <div class="error" id="error"></div>
</div>

<script>
    // ?continue= do /api/v0/sso/authorize truyền sang. Chỉ chấp nhận đường dẫn nội bộ để tránh open redirect.
    const params = new URLSearchParams(location.search);
    const rawContinue = params.get('continue') || '/';
    const continueUrl = rawContinue.startsWith('/') && !rawContinue.startsWith('//') ? rawContinue : '/';

    const $ = id => document.getElementById(id);
    const submit = $('submit'), error = $('error');

    async function login() {
      error.textContent = '';
      submit.disabled = true;
      try {
        const res = await fetch('/api/v0/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          error.textContent = body.message || 'Đăng nhập thất bại';
          return;
        }
        // Cookie SSO_SESSION đã được server set; quay lại /authorize để nhận code.
        location.replace(continueUrl);
      } catch (e) {
        error.textContent = 'Không kết nối được máy chủ';
      } finally {
        submit.disabled = false;
      }
    }

    submit.addEventListener('click', login);
    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
